[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi02w-framebuffer"
version = "0.1.0"
description = "Draw to the framebuffer from Python on Raspberry Pi"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
